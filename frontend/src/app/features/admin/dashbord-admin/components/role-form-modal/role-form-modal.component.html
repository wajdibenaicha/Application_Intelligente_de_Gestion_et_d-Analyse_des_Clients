<div class="modal-overlay" (click)="cancelled.emit()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ roleToEdit ? 'Modifier Rôle' : 'Ajouter Rôle' }}</h2>
      <button class="btn-close" (click)="cancelled.emit()">✕</button>
    </div>
    <label>Nom du rôle</label>
    <input [(ngModel)]="form.name" placeholder="Ex: Directeur, Superviseur, Marketing..." />
    <label>Permissions associées</label>
    <div class="permissions-checklist">
      <label *ngFor="let p of permissions" class="checkbox-item">
        <input type="checkbox" [checked]="isSelected(p)" (change)="toggle(p)" />
        {{ p.description }}
      </label>
      <span *ngIf="permissions.length === 0" class="empty-hint">Aucune permission disponible</span>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" (click)="cancelled.emit()">Annuler</button>
      <button class="btn-save" (click)="saved.emit(form)">{{ roleToEdit ? 'Modifier' : 'Ajouter' }}</button>
    </div>
  </div>
</div>
